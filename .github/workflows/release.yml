###############################################################################
# VirgoYT Gaming Kernel — Quick Release Publisher
# Manually tag a build from the artifact and publish as a proper Release
###############################################################################

name: 📦 Publish Kernel Release

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run ID of the build to publish (from build_kernel workflow)'
        required: true
        type: string
      version_tag:
        description: 'Release tag (e.g. v2.0-20260723)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release (beta)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  publish:
    name: 🚀 Publish Release
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release/

      - name: 📋 List downloaded files
        run: ls -lhR release/

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FogOS-${{ inputs.version_tag }}
          name: "👑 VirgoYT Gaming Kernel FogOS ${{ inputs.version_tag }}"
          body: |
            ## 👑 VirgoYT Gaming Kernel — FogOS Extreme Gaming Edition
            **Developer:** Prince · VirgoYT707
            **Device:** Motorola G45 / G34 (SM6375 / Holi)

            ### How to Flash
            1. Boot to TWRP
            2. Install → select ZIP
            3. Wipe Cache + Dalvik
            4. Reboot

            See [FLASHING_GUIDE.md](FLASHING_GUIDE.md) for full instructions and error recovery.

            ---
            *"I don't chase. I attract. I WIN."* — Prince, VirgoYT707
          files: release/**/*.zip
          prerelease: ${{ inputs.prerelease == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
