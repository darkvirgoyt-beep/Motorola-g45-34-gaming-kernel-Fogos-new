name: FogOS Extreme Gaming - Build & Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT: out
  KBUILD_BUILD_USER: prince
  KBUILD_BUILD_HOST: virgoyt707

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout Kernel
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1


    - name: Install Dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          clang \
          lld \
          gcc-aarch64-linux-gnu \
          zip \
          unzip


    - name: Set Date
      run: |
        echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV


    - name: Configure Kernel
      run: |
        make O=${OUT} ARCH=${ARCH} fogos_defconfig


    - name: Verify Config
      run: |
        if [ ! -f "${OUT}/.config" ]; then
          echo "❌ Kernel config missing"
          exit 1
        fi

        echo "✅ Kernel config created"
        ls -lh ${OUT}/.config


    - name: Build Kernel
      run: |
        make O=${OUT} \
          ARCH=${ARCH} \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(nproc) \
          Image.gz-dtb 2>&1 | tee build.log


    - name: Verify Kernel Image
      run: |
        KERNEL=${OUT}/arch/arm64/boot/Image.gz-dtb

        if [ ! -f "$KERNEL" ]; then
          echo "❌ Kernel image missing"

          echo "Searching:"
          find ${OUT} -name "Image*" -o -name "*dtb*" || true

          echo "Last build errors:"
          grep -i error build.log | tail -50 || true

          exit 1
        fi

        echo "✅ Kernel found"
        ls -lh "$KERNEL"

        echo "KERNEL_PATH=$KERNEL" >> $GITHUB_ENV


    - name: Prepare AnyKernel3 ZIP
      run: |
        mkdir -p release

        cp "${KERNEL_PATH}" anykernel3/Image

        ZIP_NAME="FogOS-Extreme-Gaming-v2.0-Holi-${DATE}"

        cd anykernel3
        zip -r9 "../release/${ZIP_NAME}.zip" . \
          --exclude="*.git*"
        cd ..

        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV


    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: release/${{ env.ZIP_NAME }}.zip
        retention-days: 30
        if-no-files-found: error


    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: FogOS-kernel-${{ env.DATE }}
        path: ${{ env.KERNEL_PATH }}
        retention-days: 30
        if-no-files-found: error


    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ env.DATE }}
        path: build.log
        retention-days: 7
        if-no-files-found: warn


    - name: Create GitHub Release
      if: github.event.inputs.release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: FogOS-v2.0-${{ env.DATE }}
        name: "VirgoYT Gaming Kernel — FogOS Extreme Gaming v2.0"
        body: |
          ## FogOS Extreme Gaming Kernel

          Developer: Prince (VirgoYT707)

          Device:
          Motorola G45 / G34 (SM6375 Holi)

          Kernel:
          Linux 5.4.x

          Built:
          ${{ env.DATE }}
