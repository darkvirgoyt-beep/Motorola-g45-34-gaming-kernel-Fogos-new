name: FogOS Kernel Build

on:
  push:
    branches: [ sixteen-qpr2, main, master, develop ]
  pull_request:
    branches: [ sixteen-qpr2, main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 wget tar xz-utils

      - name: Setup GCC toolchain
        run: |
          apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Download and setup Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.0.0/clang+llvm-18.0.0-x86_64-linux-gnu.tar.xz
          tar -xf clang+llvm-18.0.0-x86_64-linux-gnu.tar.xz
          mv clang+llvm-18.0.0-x86_64-linux-gnu clang
          rm -f clang+llvm-18.0.0-x86_64-linux-gnu.tar.xz

      - name: Verify toolchain
        run: |
          $HOME/toolchains/clang/bin/clang --version
          aarch64-linux-gnu-gcc --version

      - name: Build FogOS Kernel
        run: |
          chmod +x build_fogos.sh
          ./build_fogos.sh 2>&1 | tee build.log
        env:
          CLANG_DIR: ${{ format('{0}/toolchains/clang', env.HOME) }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: build.log
          retention-days: 7

      - name: Upload kernel binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fogos-kernel-${{ github.run_number }}
          path: release/
          retention-days: 30
          if-no-files-found: warn
