name: FogOS Extreme Gaming - Build & Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT: out
  KBUILD_BUILD_USER: prince
  KBUILD_BUILD_HOST: virgoyt707

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

    - name: Checkout Kernel
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1


    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          clang \
          lld \
          gcc-aarch64-linux-gnu \
          zip \
          unzip


    - name: Set Date
      run: |
        echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV


    - name: Configure Kernel
      run: |
        make O=${OUT} ARCH=${ARCH} vendor/holi_defconfig


    - name: Build Kernel
      run: |
        make O=${OUT} \
          ARCH=${ARCH} \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(nproc) \
          Image.gz-dtb \
          2>&1 | tee build.log


    - name: Verify Kernel
      run: |
        KERNEL=${OUT}/arch/arm64/boot/Image.gz-dtb

        if [ ! -f "$KERNEL" ]; then
          echo "Kernel missing"
          find ${OUT} -name "Image*" -o -name "*dtb*"
          exit 1
        fi

        ls -lh "$KERNEL"

        echo "KERNEL_PATH=$KERNEL" >> $GITHUB_ENV


    - name: Prepare Release
      run: |
        mkdir -p release

        cp "${KERNEL_PATH}" release/Image.gz-dtb

        zip -j \
        release/FogOS-kernel-${DATE}.zip \
        release/Image.gz-dtb


    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FogOS-kernel-${{ env.DATE }}
        path: release/
        retention-days: 30


    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ env.DATE }}
        path: build.log
