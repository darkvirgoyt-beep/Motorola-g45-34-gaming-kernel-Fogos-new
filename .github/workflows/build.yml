name: FogOS Kernel — Build & Boot Image

###############################################################################
# Builds the VirgoYT Gaming Kernel (FogOS) for Motorola G45/G34 (SM6375/Holi)
# and packs it into a fastboot-flashable boot.img using the stock image.
#
# Developer : Prince · VirgoYT707
# Device    : Motorola G45 / G34 (SM6375 — Holi Platform)
# Base      : Linux 5.4.302 · Android 16
###############################################################################

on:
  push:
    branches: [main, sixteen-qpr2]
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'kernel/**'
      - 'mm/**'
      - 'net/**'
      - 'fs/**'
      - 'block/**'
      - 'crypto/**'
      - 'sound/**'
      - 'techpack/**'
      - 'build_fogos.sh'
      - 'scripts/**'
      - 'stock/boot.img'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      prerelease:
        description: 'Mark as pre-release (beta)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT: out
  KBUILD_BUILD_USER: prince
  KBUILD_BUILD_HOST: virgoyt707

jobs:
  build:
    name: 🔨 Build Kernel & Boot Image
    runs-on: ubuntu-24.04

    steps:
      # ──────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ──────────────────────────────────────────────────────────────────────
      - name: 🛠️ Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev make \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zip unzip \
            mkbootimg \
            python3 python3-pip \
            cpio git

          # Ubuntu 24.04's apt mkbootimg ships broken: it imports 'gki' but the
          # package doesn't include that module.  Create a harmless stub so
          # the import succeeds.  The gki module is only used for GKI boot
          # certificate generation — not needed for plain kernel repacking.
          SITE=$(python3 -c "import site; print(site.getsitepackages()[0])")
          sudo mkdir -p "${SITE}/gki"
          sudo tee "${SITE}/gki/__init__.py" > /dev/null << 'PYEOF'
PYEOF
          sudo tee "${SITE}/gki/generate_gki_certificate.py" > /dev/null << 'PYEOF'
def generate_gki_certificate(*args, **kwargs):
    return None
PYEOF

          # Smoke-test both tools
          unpack_bootimg --help 2>&1 | head -1
          mkbootimg --version 2>&1 || python3 /usr/bin/mkbootimg --version 2>&1 || true
          echo "✅ Dependencies installed"

      # ──────────────────────────────────────────────────────────────────────
      - name: 📅 Set Build Date
        run: echo "DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      # ──────────────────────────────────────────────────────────────────────
      - name: ⚙️ Configure Kernel
        run: |
          # vendor/fogos_defconfig is the primary FogOS config
          DEFCONFIG="vendor/fogos_defconfig"
          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "⚠️  fogos_defconfig not found, falling back to holi-qgki_defconfig"
            DEFCONFIG="vendor/holi-qgki_defconfig"
          fi
          echo "Using defconfig: ${DEFCONFIG}"

          make O=${OUT} \
            ARCH=${ARCH} \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            ${DEFCONFIG}

          echo "✅ Kernel configured"
          echo "DEFCONFIG=${DEFCONFIG}" >> $GITHUB_ENV

      # ──────────────────────────────────────────────────────────────────────
      - name: 🔧 Build Kernel
        run: |
          echo "🚀 Building kernel with $(nproc) jobs..."
          make O=${OUT} \
            ARCH=${ARCH} \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) \
            2>&1 | tee build.log

          echo "Build exit: $?"

      # ──────────────────────────────────────────────────────────────────────
      - name: 🔍 Find Kernel Image
        run: |
          # fogos_defconfig sets CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y → Image
          # Use a local variable to track success; $GITHUB_ENV writes are only
          # visible to *subsequent* steps, not the current shell.
          found_kernel=""
          for img in \
            "${OUT}/arch/arm64/boot/Image" \
            "${OUT}/arch/arm64/boot/Image.gz" \
            "${OUT}/arch/arm64/boot/Image.lz4" \
            "${OUT}/arch/arm64/boot/Image.gz-dtb"; do
            if [ -f "$img" ]; then
              echo "✅ Kernel image: $img  ($(du -sh "$img" | cut -f1))"
              echo "KERNEL_PATH=$img" >> "$GITHUB_ENV"
              found_kernel="$img"
              break
            fi
          done

          if [ -z "$found_kernel" ]; then
            echo "❌ No kernel image found. Last 50 build errors:"
            grep -iE "error:|undefined reference|fatal:" build.log | tail -50 || true
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      - name: 📦 Create Flashable Boot Image
        run: |
          mkdir -p release

          echo "📱 Packing boot.img for Motorola G45 (SM6375 / Holi)..."
          bash scripts/create_bootimg.sh \
            stock/boot.img \
            "${KERNEL_PATH}" \
            "release/FogOS-boot-${DATE}.img"

          ls -lh "release/FogOS-boot-${DATE}.img"
          echo "BOOT_IMG=release/FogOS-boot-${DATE}.img" >> $GITHUB_ENV

      # ──────────────────────────────────────────────────────────────────────
      - name: 🤐 Prepare AnyKernel3 ZIP (TWRP flash)
        run: |
          # Copy kernel into AnyKernel3 directory
          cp "${KERNEL_PATH}" anykernel3/Image 2>/dev/null || true

          ZIP_NAME="FogOS-Extreme-Gaming-v2.0-Holi-${DATE}"
          cd anykernel3
          zip -r9 "../release/${ZIP_NAME}.zip" . --exclude="*.git*"
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          ls -lh "release/${ZIP_NAME}.zip"

      # ──────────────────────────────────────────────────────────────────────
      - name: 📤 Upload Boot Image (fastboot-flashable)
        uses: actions/upload-artifact@v4
        with:
          name: FogOS-boot-${{ env.DATE }}
          path: release/FogOS-boot-${{ env.DATE }}.img
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload AnyKernel3 ZIP (TWRP-flashable)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: release/${{ env.ZIP_NAME }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DATE }}
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      # ──────────────────────────────────────────────────────────────────────
      - name: 🚀 Create GitHub Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FogOS-v2.0-${{ env.DATE }}
          name: "👑 FogOS Extreme Gaming Kernel v2.0 — ${{ env.DATE }}"
          body: |
            ## 👑 VirgoYT Gaming Kernel — FogOS Extreme Gaming Edition

            | Field | Value |
            |-------|-------|
            | **Developer** | Prince · VirgoYT707 |
            | **Device** | Motorola G45 / G34 (SM6375 / Holi) |
            | **Android** | 16.0.0 · Security Patch 2026-06 |
            | **Kernel** | Linux 5.4.302 |
            | **Build** | ${{ env.DATE }} |

            ---

            ### 📱 Method 1 — Fastboot (Recommended)

            > Requires **unlocked bootloader**. Works with AVB.

            ```bash
            # Download: FogOS-boot-${{ env.DATE }}.img
            adb reboot bootloader
            fastboot flash boot FogOS-boot-${{ env.DATE }}.img
            fastboot reboot
            ```

            ### 📦 Method 2 — TWRP

            1. Boot to TWRP recovery
            2. Install → select `${{ env.ZIP_NAME }}.zip`
            3. Wipe Cache + Dalvik → Reboot

            ---

            ### ✨ Gaming Features
            - CPU locked to performance governor · all 8 cores at peak
            - TCP BBR for lowest BGMI/PUBG ping
            - BFQ I/O scheduler · ZRAM ZSTD compression
            - SELinux Enforcing · banking apps work

            See [FLASHING_GUIDE.md](FLASHING_GUIDE.md) for full instructions and recovery steps.

            ---
            *"I don't chase. I attract. I WIN."* — Prince, VirgoYT707
          files: |
            release/FogOS-boot-${{ env.DATE }}.img
            release/${{ env.ZIP_NAME }}.zip
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
