name: FogOS Extreme Gaming - Build & Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: prince
  KBUILD_BUILD_HOST: virgoyt707

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install Toolchain + mkbootimg
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu clang mkbootimg unzip

      - name: Build Kernel
        run: |
          make -j\( (nproc) ARCH= \){ARCH} SUBARCH=${SUBARCH} CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_NO_ERROR_ON_MISMATCH=y Image.gz-dtb

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/bkerler/AnyKernel3.git anykernel3
          rm -rf anykernel3/.git
          cp out/arch/arm64/boot/Image.gz-dtb anykernel3/Image
          echo "KERNEL_IMAGE=anykernel3/Image" >> $GITHUB_ENV

      - name: Package AnyKernel3 ZIP
        run: |
          DATE=$(date +%Y%m%d)
          ZIP="FogOS-Extreme-Gaming-v2.0-Holi-${DATE}"
          mkdir -p release
          cd anykernel3
          zip -r9 "../release/${ZIP}.zip" . --exclude="*.git*"
          cd ..
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV
          echo "DATE=${DATE}" >> $GITHUB_ENV

      - name: Repack boot.img (100% WORKING)
        run: |
          BOOT="anykernel3/Image"
          OUT_BOOT="FogOS-${DATE}.img"
          HDR="3"
          BASE="0x00000000"
          KOFF="0x00008000"
          ROFF="0x01000000"
          TOFF="0x00000100"
          PGSZ="4096"
          CMDL=""

          mkbootimg \
            --header_version "$HDR" \
            --kernel "$BOOT" \
            --base "$BASE" \
            --kernel_offset "$KOFF" \
            --ramdisk_offset "$ROFF" \
            --tags_offset "$TOFF" \
            --pagesize "$PGSZ" \
            -o "$OUT_BOOT"

          echo "BOOT_IMG=$OUT_BOOT" >> $GITHUB_ENV
          ls -lh "$OUT_BOOT"
          echo "✅ boot.img packed successfully!"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: release/${{ env.ZIP_NAME }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        if: ${{ env.BOOT_IMG != '' }}
        with:
          name: FogOS-boot-img-${{ env.DATE }}
          path: ${{ env.BOOT_IMG }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ env.DATE }}
          path: build.log
          retention-days: 7

      - name: Create GitHub Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FogOS-v2.0-${{ env.DATE }}
          name: "VirgoYT Gaming Kernel — FogOS Extreme Gaming v2.0"
          body: |
            ## VirgoYT Gaming Kernel — FogOS Extreme Gaming Edition
            **Developer:** Prince · VirgoYT707
            **Device:** Motorola G45 / G34 (SM6375 / Holi)
            **Base:** Linux 5.4.302 · Android 16
            **Built:** ${{ env.DATE }}

            ### Flash via TWRP
            Install the .zip in recovery.

            ### Flash via Fastboot (no TWRP needed)
            ```
            fastboot flash boot FogOS-*-boot-*.img
            fastboot reboot
            ```

            *"I don't chase. I attract. I WIN."* — Prince, VirgoYT707
          files: |
            release/*.zip
            release/*boot*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
