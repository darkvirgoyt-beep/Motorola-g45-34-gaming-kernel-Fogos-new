name: FogOS Kernel Build

on:
  push:
    branches: [ sixteen-qpr2, main, master, develop ]
  pull_request:
    branches: [ sixteen-qpr2, main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 wget tar

      - name: Install Clang & GCC toolchain
        run: |
          apt-get install -y clang llvm lld llvm-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          mkdir -p $HOME/toolchains/clang/bin
          ln -sf $(which clang) $HOME/toolchains/clang/bin/clang
          ln -sf $(which ld.lld) $HOME/toolchains/clang/bin/ld.lld
          ln -sf $(which llvm-ar) $HOME/toolchains/clang/bin/llvm-ar
          ln -sf $(which llvm-nm) $HOME/toolchains/clang/bin/llvm-nm
          ln -sf $(which llvm-objcopy) $HOME/toolchains/clang/bin/llvm-objcopy
          ln -sf $(which llvm-objdump) $HOME/toolchains/clang/bin/llvm-objdump
          ln -sf $(which llvm-strip) $HOME/toolchains/clang/bin/llvm-strip

      - name: Build FogOS Kernel
        run: |
          chmod +x build_fogos.sh
          export CLANG_DIR=$HOME/toolchains/clang
          ./build_fogos.sh 2>&1 | tee build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: build.log

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fogos-kernel-${{ github.run_number }}
          path: release/
          if-no-files-found: warn
