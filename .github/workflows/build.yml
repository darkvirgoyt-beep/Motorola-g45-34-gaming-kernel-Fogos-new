name: FogOS Kernel Build

on:
  push:
    branches: [main, sixteen-qpr2]
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'kernel/**'
      - 'mm/**'
      - 'net/**'
      - 'fs/**'
      - 'block/**'
      - 'crypto/**'
      - 'sound/**'
      - 'techpack/**'
      - 'build_fogos.sh'
      - 'scripts/**'
      - 'stock/boot.img'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT: out
  KBUILD_BUILD_USER: prince
  KBUILD_BUILD_HOST: virgoyt707

jobs:
  build:
    name: Build Kernel and Boot Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev make \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zip unzip python3 python3-pip cpio git mkbootimg

          # Ubuntu 24.04 mkbootimg imports 'gki' but does not ship it.
          # Create a stub so the import succeeds (only used for GKI cert signing).
          GKI_DIR=$(python3 -c "import site; print(site.getsitepackages()[0])")/gki
          sudo mkdir -p "$GKI_DIR"
          echo "" | sudo tee "$GKI_DIR/__init__.py" > /dev/null
          printf 'def generate_gki_certificate(*a, **k): return None\n' \
            | sudo tee "$GKI_DIR/generate_gki_certificate.py" > /dev/null
          echo "gki stub installed at $GKI_DIR"

          # Verify both tools work
          unpack_bootimg --help 2>&1 | head -1
          python3 /usr/bin/mkbootimg --version 2>&1 || true
          echo "Dependencies OK"

      - name: Set build date
        run: echo "DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Configure kernel
        run: |
          DEFCONFIG="vendor/fogos_defconfig"
          CFG_PATH="arch/arm64/configs/${DEFCONFIG}"
          if [ ! -f "$CFG_PATH" ]; then
            echo "ERROR: $CFG_PATH not found — aborting. Do not fall back to a generic config."
            exit 1
          fi
          echo "Using defconfig: $CFG_PATH"

          # yes '' auto-answers any new Kconfig prompts with their default value
          yes "" | make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"

          # Resolve any remaining unset symbols silently
          make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"
          echo "Kernel configured OK"

      - name: Build kernel
        run: |
          echo "Building with $(nproc) jobs..."
          make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" 2>&1 | tee build.log
          echo "Build finished"

      - name: Find kernel image
        run: |
          FOUND=""
          for img in \
            "$OUT/arch/arm64/boot/Image" \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$OUT/arch/arm64/boot/Image.lz4" \
            "$OUT/arch/arm64/boot/Image.gz-dtb"; do
            if [ -f "$img" ]; then
              echo "Kernel image: $img  ($(du -sh "$img" | cut -f1))"
              echo "KERNEL_PATH=$img" >> "$GITHUB_ENV"
              FOUND="$img"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "ERROR: No kernel image found. Last build errors:"
            grep -iE "error:|undefined reference|fatal:" build.log | tail -50 || true
            exit 1
          fi

      - name: Create boot image
        run: |
          mkdir -p release
          bash scripts/create_bootimg.sh \
            stock/boot.img \
            "$KERNEL_PATH" \
            "release/FogOS-boot-${DATE}.img"
          ls -lh "release/FogOS-boot-${DATE}.img"
          echo "BOOT_IMG=release/FogOS-boot-${DATE}.img" >> "$GITHUB_ENV"

      - name: Create AnyKernel3 ZIP
        run: |
          cp "$KERNEL_PATH" anykernel3/Image 2>/dev/null || true
          ZIP_NAME="FogOS-Extreme-Gaming-v2.0-Holi-${DATE}"
          cd anykernel3
          zip -r9 "../release/${ZIP_NAME}.zip" . --exclude="*.git*"
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -lh "release/${ZIP_NAME}.zip"

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: FogOS-boot-${{ env.DATE }}
          path: release/FogOS-boot-${{ env.DATE }}.img
          retention-days: 30
          if-no-files-found: error

      - name: Upload AnyKernel3 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: release/${{ env.ZIP_NAME }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DATE }}
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Set repository public
        if: github.event_name == 'push' || github.event.inputs.release == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}" \
            -d '{"private":false,"visibility":"public"}')
          if [ "$HTTP" = "200" ]; then
            echo "Repository set to public"
          else
            echo "Could not set repo public (HTTP $HTTP) — check GH_PAT has Administration:write scope"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FogOS-v2.0-${{ env.DATE }}
          name: FogOS Extreme Gaming Kernel v2.0 - ${{ env.DATE }}
          body: |
            VirgoYT Gaming Kernel - FogOS Extreme Gaming Edition

            Developer: Prince (VirgoYT707)
            Device: Motorola G45 / G34 (SM6375 / Holi)
            Android: 16.0.0 - Security Patch 2026-06
            Kernel: Linux 5.4.302
            Build: ${{ env.DATE }}

            --- Fastboot (Recommended) ---
            adb reboot bootloader
            fastboot flash boot FogOS-boot-${{ env.DATE }}.img
            fastboot reboot

            --- TWRP ---
            1. Boot to TWRP
            2. Install the ZIP file
            3. Wipe Cache + Dalvik
            4. Reboot

            Features: CPU performance governor, TCP BBR, BFQ I/O, ZRAM ZSTD, SELinux Enforcing

            "I don't chase. I attract. I WIN." - Prince, VirgoYT707
          files: |
            release/FogOS-boot-${{ env.DATE }}.img
            release/${{ env.ZIP_NAME }}.zip
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: false
          token: ${{ secrets.GH_PAT }}
