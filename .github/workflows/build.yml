name: FogOS Extreme Gaming Kernel — Build & Release

on:
  push:
    branches: [ sixteen-qpr2, main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: prince
      KBUILD_BUILD_HOST: virgoyt707

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev libncurses-dev \
            clang llvm lld \
            python3 python-is-python3 \
            zip unzip cpio rsync dwarves

      - name: Show compiler version
        run: |
          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version | head -1

      - name: Generate defconfig
        run: |
          mkdir -p out
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            vendor/holi-qgki_defconfig

      - name: Merge gaming config fragment
        run: |
          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/fogos_gaming.config
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

      - name: Build kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            LD=ld.lld \
            LOCALVERSION="-FogOS-v2.0" \
            Image 2>&1 | tee build.log

      - name: Verify kernel image
        run: |
          BOOT=out/arch/arm64/boot
          if [ -f "$BOOT/Image" ]; then
            echo "KERNEL_IMAGE=$BOOT/Image" >> $GITHUB_ENV
            ls -lh "$BOOT/Image"
          elif [ -f "$BOOT/Image.gz" ]; then
            echo "KERNEL_IMAGE=$BOOT/Image.gz" >> $GITHUB_ENV
            ls -lh "$BOOT/Image.gz"
          else
            echo "ERROR: No kernel image found!"
            tail -100 build.log
            exit 1
          fi
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Repack boot.img
        run: |
          pip3 install mkbootimg 2>&1 | tail -3
          KERNEL="${{ env.KERNEL_IMAGE }}"
          STOCK="stock/boot.img"
          mkdir -p release

          if [ ! -f "$STOCK" ]; then
            echo "No stock/boot.img — skipping boot.img repack"
            exit 0
          fi

          echo "Unpacking stock boot.img..."
          mkdir -p /tmp/bootunpack
          unpackbootimg --input "$STOCK" --output /tmp/bootunpack/ 2>&1

          echo "Contents of unpack dir:"
          ls -lh /tmp/bootunpack/

          # Header version
          HDR=$(cat /tmp/bootunpack/*header_version 2>/dev/null || echo "3")
          RAMDISK=$(ls /tmp/bootunpack/*ramdisk* 2>/dev/null | head -1 || echo "")
          echo "Header version: $HDR"
          echo "Ramdisk: $RAMDISK"

          OUT_BOOT="release/FogOS-Extreme-Gaming-v2.0-boot-${{ env.DATE }}.img"

          if [ "$HDR" = "3" ] || [ "$HDR" = "4" ]; then
            OS_VER=$(cat /tmp/bootunpack/*os_version 2>/dev/null || echo "")
            OS_PATCH=$(cat /tmp/bootunpack/*os_patch_level 2>/dev/null || echo "")
            mkbootimg \
              --header_version "$HDR" \
              --kernel "$KERNEL" \
              ${RAMDISK:+--ramdisk "$RAMDISK"} \
              ${OS_VER:+--os_version "$OS_VER"} \
              ${OS_PATCH:+--os_patch_level "$OS_PATCH"} \
              -o "$OUT_BOOT"
          else
            BASE=$(cat /tmp/bootunpack/*base 2>/dev/null || echo "0x00000000")
            KOFF=$(cat /tmp/bootunpack/*kernel_offset 2>/dev/null || echo "0x00008000")
            ROFF=$(cat /tmp/bootunpack/*ramdisk_offset 2>/dev/null || echo "0x01000000")
            TOFF=$(cat /tmp/bootunpack/*tags_offset 2>/dev/null || echo "0x00000100")
            PGSZ=$(cat /tmp/bootunpack/*pagesize 2>/dev/null || echo "4096")
            CMDL=$(cat /tmp/bootunpack/*cmdline 2>/dev/null || echo "")
            mkbootimg \
              --header_version "$HDR" \
              --kernel "$KERNEL" \
              ${RAMDISK:+--ramdisk "$RAMDISK"} \
              --base "$BASE" \
              --kernel_offset "$KOFF" \
              --ramdisk_offset "$ROFF" \
              --tags_offset "$TOFF" \
              --pagesize "$PGSZ" \
              ${CMDL:+--cmdline "$CMDL"} \
              -o "$OUT_BOOT"
          fi
          echo "BOOT_IMG=$OUT_BOOT" >> $GITHUB_ENV
          ls -lh "$OUT_BOOT"
          echo "boot.img repacked successfully!"

      - name: Package AnyKernel3 ZIP
        run: |
          KERNEL="${{ env.KERNEL_IMAGE }}"
          DATE="${{ env.DATE }}"
          ZIP="FogOS-Extreme-Gaming-v2.0-Holi-${DATE}"
          mkdir -p release

          # Copy kernel into anykernel3
          cp "$KERNEL" anykernel3/Image

          # Gaming init script
          mkdir -p anykernel3/system/etc/init.d
          cp anykernel3/fogos_gaming_init.sh \
             anykernel3/system/etc/init.d/99-fogos-gaming
          chmod 755 anykernel3/system/etc/init.d/99-fogos-gaming

          cd anykernel3
          zip -r9 "../release/${ZIP}.zip" . \
            --exclude="*.git*" \
            --exclude="fogos_gaming_init.sh"
          cd ..
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV
          ls -lh "release/${ZIP}.zip"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: release/${{ env.ZIP_NAME }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        if: ${{ env.BOOT_IMG != '' }}
        with:
          name: FogOS-boot-img-${{ env.DATE }}
          path: ${{ env.BOOT_IMG }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ env.DATE }}
          path: build.log
          retention-days: 7

      - name: Create GitHub Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FogOS-v2.0-${{ env.DATE }}
          name: "VirgoYT Gaming Kernel — FogOS Extreme Gaming v2.0"
          body: |
            ## VirgoYT Gaming Kernel — FogOS Extreme Gaming Edition
            **Developer:** Prince · VirgoYT707
            **Device:** Motorola G45 / G34 (SM6375 / Holi)
            **Base:** Linux 5.4.302 · Android 16
            **Built:** ${{ env.DATE }}

            ### Flash via TWRP
            Install the `.zip` in recovery.

            ### Flash via Fastboot (no TWRP needed)
            ```
            fastboot flash boot FogOS-*-boot-*.img
            fastboot reboot
            ```

            *"I don't chase. I attract. I WIN."* — Prince, VirgoYT707
          files: |
            release/*.zip
            release/*boot*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
