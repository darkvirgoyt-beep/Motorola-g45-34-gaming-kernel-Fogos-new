name: FogOS Kernel Build

on:
  push:
    branches: [ sixteen-qpr2, main, master, develop ]
  pull_request:
    branches: [ sixteen-qpr2, main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          # Removed g++-multilib to ensure compatibility inside the clean 22.04 container environment
          apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 wget tar libelf-dev

      - name: Fetch Official AOSP Clang & GCC Toolchains
        run: |
          # Install standard cross-compilers
          apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf lld llvm
          
          # Create and deploy Google AOSP Clang directly into the expected path
          mkdir -p $HOME/toolchains/clang
          cd $HOME/toolchains/clang
          wget https://googlesource.com
          tar -xf clang-r530567.tar.gz
          rm clang-r530567.tar.gz

      - name: Build FogOS Kernel
        run: |
          chmod +x build_fogos.sh
          export CLANG_DIR=$HOME/toolchains/clang
          export PATH=$CLANG_DIR/bin:$PATH
          ./build_fogos.sh 2>&1 | tee build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: build.log

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fogos-kernel-${{ github.run_number }}
          path: release/
          if-no-files-found: warn
