name: FogOS Shell Unit Tests

on:
  push:
    branches: [ sixteen-qpr2, main ]
  pull_request:
  workflow_dispatch:

jobs:
  shell-unit-tests:
    name: Shell unit tests (bats)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Syntax-check FogOS scripts
        run: |
          bash -n build_fogos.sh
          bash -n anykernel3/fogos_game_detector.sh
          bash -n anykernel3/fogos_gaming_init.sh

      - name: Run unit tests
        run: bats tests/*.bats
